# Allegro configuration for revMD17 - Aspirin
# Target: Reproduce Energy MAE ~3.84 meV and Force MAE ~12.98 meV/Å

run: [train, test]

# Cutoff radius for revMD17
cutoff_radius: 5.0

# Chemical symbols for aspirin (C9H8O4)
chemical_symbols: [C, O, H]
model_type_names: ${chemical_symbols}

# Data configuration
data:
  _target_: nequip.data.datamodule.sGDML_CCSD_DataModule
  dataset: aspirin
  data_source_dir: ../../data/revmd17/aspirin

  transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ${chemical_symbols}

  # Training subset size (paper uses various sizes)
  # For full reproduction, use: trainval_test_subset: [950, 50]
  # For quick testing, use smaller sizes
  trainval_test_subset: [950, 50]
  train_val_split: [900, 50]

  seed: 123

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1  # MD17 uses small batches due to varying system sizes
    shuffle: true
    num_workers: 2
    pin_memory: true

  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    shuffle: false
    num_workers: 2
    pin_memory: true

  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    type_names: ${model_type_names}

# Trainer configuration
trainer:
  _target_: lightning.Trainer
  max_epochs: 10000
  check_val_every_n_epoch: 10
  log_every_n_steps: 10
  accelerator: auto
  devices: 1

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      filename: best_model
      monitor: val/forces_mae
      mode: min
      save_top_k: 3
      save_last: true

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/forces_mae
      patience: 500
      mode: min

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

num_scalar_features: 128

training_module:
  _target_: nequip.train.EMALightningModule

  # Loss function - both energy and forces for MD17
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 10.0  # Higher weight on forces for MD17

  # Validation metrics
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0

  test_metrics: ${training_module.val_metrics}

  # Optimizer
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    weight_decay: 1e-5

  # Learning rate scheduler
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 100
    min_lr: 1e-6

  # Allegro model
  model:
    _target_: allegro.model.AllegroModel

    seed: 456
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    # Two-body scalar embedding
    radial_chemical_embed:
      _target_: allegro.nn.TwoBodyBesselScalarEmbed
      num_bessels: 8
      bessel_trainable: false
      polynomial_cutoff_p: 6

    radial_chemical_embed_dim: ${num_scalar_features}

    # Scalar embedding MLP
    scalar_embed_mlp_hidden_layers_depth: 2
    scalar_embed_mlp_hidden_layers_width: ${num_scalar_features}
    scalar_embed_mlp_nonlinearity: silu

    # === Core hyperparameters (from paper for MD17) ===
    # For MD17, paper likely uses l_max=2 for higher accuracy
    l_max: 2

    # Number of tensor product layers (2-3 for MD17)
    num_layers: 2

    # Number of scalar features
    num_scalar_features: ${num_scalar_features}

    # Number of tensor features
    num_tensor_features: 64

    # Allegro MLP configuration
    allegro_mlp_hidden_layers_depth: 2
    allegro_mlp_hidden_layers_width: ${num_scalar_features}
    allegro_mlp_nonlinearity: silu

    # Advanced hyperparameters
    parity: true
    tp_path_channel_coupling: true

    # Readout MLP
    readout_mlp_hidden_layers_depth: 2
    readout_mlp_hidden_layers_width: ${num_scalar_features}
    readout_mlp_nonlinearity: silu

    # Normalization and shifts
    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales: ${training_data_stats:forces_rms}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false

global_options:
  allow_tf32: false

hydra:
  run:
    dir: ../../results/revmd17/aspirin/${now:%Y-%m-%d}/${now:%H-%M-%S}
