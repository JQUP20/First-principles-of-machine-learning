# Allegro configuration for QM9 - U0 target (Internal Energy at 0K)
# Target: Reproduce MAE of 4 meV reported in the paper

# Run configuration
run: [train, test]

# Global cutoff radius (in Angstroms)
cutoff_radius: 5.0

# Chemical species in QM9
chemical_symbols: [H, C, N, O, F]
model_type_names: ${chemical_symbols}

# Data configuration
data:
  _target_: nequip.data.datamodule.QM9DataModule
  # QM9 target property - U0 (Internal energy at 0K)
  target: U0
  # Data will be downloaded automatically to this directory
  data_source_dir: ../../data/qm9

  # Data transforms
  transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ${chemical_symbols}

  # Standard QM9 split
  # Total: ~134k molecules
  # Train: 110,000 / Val: 10,000 / Test: ~13,885
  train_size: 110000
  val_size: 10000
  # test set is the remainder

  seed: 123

  # DataLoader configuration
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    shuffle: true
    num_workers: 4
    pin_memory: true

  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 10
    shuffle: false
    num_workers: 2
    pin_memory: true

  test_dataloader: ${data.val_dataloader}

  # Statistics manager for data normalization
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    type_names: ${model_type_names}

# Trainer configuration
trainer:
  _target_: lightning.Trainer
  max_epochs: 1000
  check_val_every_n_epoch: 10
  log_every_n_steps: 50
  accelerator: auto
  devices: 1

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      filename: best_model
      monitor: val/per_atom_energy_mae
      mode: min
      save_top_k: 3
      save_last: true

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/per_atom_energy_mae
      patience: 100
      mode: min

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

# Model interpolation parameter
num_scalar_features: 128

# Training module configuration
training_module:
  _target_: nequip.train.EMALightningModule

  # Loss function - energy only for QM9
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 0.0  # QM9 doesn't have forces

  # Validation metrics
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0

  test_metrics: ${training_module.val_metrics}

  # Optimizer - Allegro works best with lr ~1e-3
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    weight_decay: 1e-5

  # Learning rate scheduler
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 50

  # Allegro model
  model:
    _target_: allegro.model.AllegroModel

    # PyTorch compilation for speedup (requires PyTorch >= 2.6.0)
    # compile_mode: compile

    # Basic model parameters
    seed: 456
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    # Two-body scalar embedding
    radial_chemical_embed:
      _target_: allegro.nn.TwoBodyBesselScalarEmbed
      num_bessels: 8
      bessel_trainable: false
      polynomial_cutoff_p: 6

    radial_chemical_embed_dim: ${num_scalar_features}

    # Scalar embedding MLP
    scalar_embed_mlp_hidden_layers_depth: 2
    scalar_embed_mlp_hidden_layers_width: ${num_scalar_features}
    scalar_embed_mlp_nonlinearity: silu

    # === Core hyperparameters (from paper) ===
    # Maximum spherical harmonic order
    # Paper uses l_max=1 for single layer baseline
    l_max: 1

    # Number of tensor product layers
    # Paper shows 1 layer achieves SOTA on QM9
    num_layers: 1

    # Number of scalar features
    num_scalar_features: ${num_scalar_features}

    # Number of tensor features
    num_tensor_features: 64

    # Allegro MLP configuration
    allegro_mlp_hidden_layers_depth: 2
    allegro_mlp_hidden_layers_width: ${num_scalar_features}
    allegro_mlp_nonlinearity: silu

    # Advanced hyperparameters
    parity: true
    tp_path_channel_coupling: true

    # Readout MLP
    readout_mlp_hidden_layers_depth: 2
    readout_mlp_hidden_layers_width: ${num_scalar_features}
    readout_mlp_nonlinearity: silu

    # Normalization and shifts
    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales: ${training_data_stats:forces_rms}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false

# Global options
global_options:
  allow_tf32: false

# Hydra configuration for output
hydra:
  run:
    dir: ../../results/qm9/U0/${now:%Y-%m-%d}/${now:%H-%M-%S}
