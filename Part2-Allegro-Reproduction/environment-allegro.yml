name: allegro-reproduction
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch and CUDA (adjust cuda version as needed)
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # Scientific computing
  - numpy
  - scipy
  - matplotlib
  - pandas
  - jupyter
  - jupyterlab
  - ipython

  # Data handling
  - h5py
  - netcdf4

  # Chemistry and materials
  - ase

  # Utilities
  - tqdm
  - pyyaml
  - pytest

  # Pip packages
  - pip
  - pip:
      # NequIP and Allegro
      - nequip>=0.13.0
      - nequip-allegro>=0.4.0

      # Additional utilities
      - wandb  # For experiment tracking (optional)
      - tensorboard  # For visualization
      - seaborn  # For plotting
      - scikit-learn  # For data analysis
